spring:
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          matchMemberClient:
            connectTimeout: ${MATCH_USER_CONNECT_TIMEOUT_MS:1000}
            readTimeout: ${MATCH_USER_READ_TIMEOUT_MS:2000}
          matchFacilityClient:
            connectTimeout: ${MATCH_FACILITY_CONNECT_TIMEOUT_MS:1000}
            readTimeout: ${MATCH_FACILITY_READ_TIMEOUT_MS:2000}
  datasource:
    username: ${MATCH_DB_USERNAME:match_app}
    password: ${MATCH_APP_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${MATCH_DB_DDL_AUTO:validate}

management:
  health:
    db:
      enabled: ${MATCH_DB_HEALTH_ENABLED:true}

match:
  starting-soon:
    enabled: ${MATCH_STARTING_SOON_ENABLED:true}
    delay-ms: ${MATCH_STARTING_SOON_DELAY_MS:60000}
    initial-delay-ms: ${MATCH_STARTING_SOON_INITIAL_DELAY_MS:60000}
  # 탈퇴 Saga 처리. dev·prod에서는 켠다(match-service-dev.yml, match-service-prod.yml).
  withdrawal:
    enabled: ${MATCH_WITHDRAWAL_ENABLED:false}
  # 포인트 보증금 Saga(backend 이슈 #125). 생성·참가·승급 확정 전에 보증금 10점을 차감한다.
  deposit:
    enabled: ${MATCH_DEPOSIT_ENABLED:true}
    timeout: ${MATCH_DEPOSIT_TIMEOUT:5m}
    maintenance-delay-ms: ${MATCH_DEPOSIT_MAINTENANCE_DELAY_MS:10000}
  # 시작·종료 시각에 맞춘 상태 전이(IN_PROGRESS·COMPLETED)와 종료 시 출석 정산 요청 발행.
  lifecycle:
    enabled: ${MATCH_LIFECYCLE_ENABLED:true}
    delay-ms: ${MATCH_LIFECYCLE_DELAY_MS:60000}
    initial-delay-ms: ${MATCH_LIFECYCLE_INITIAL_DELAY_MS:60000}
  clients:
    user:
      url: ${MATCH_USER_SERVICE_URL:}
    facility:
      url: ${MATCH_FACILITY_SERVICE_URL:}

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 2
        ignoreExceptions:
          - feign.FeignException$NotFound
  timelimiter:
    configs:
      default:
        timeoutDuration: 3s
