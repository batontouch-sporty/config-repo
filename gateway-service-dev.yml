# Compose. 같은 네트워크의 서비스명과 내부 포트로 붙는다.
spring:
  rabbitmq:
    host: rabbitmq
    port: 5672
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins: ${CORS_ALLOWED_ORIGIN:http://localhost:3000}

prometheus:
  url: ${PROMETHEUS_URL:http://prometheus:9090}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://discovery-service:8761/eureka}

management:
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans
