# 전 서비스 공통 설정. 서비스별 값은 <서비스명>.yml, 환경별 접속 주소는 <서비스명>-<프로필>.yml에 둔다.
eureka:
  instance:
    instance-id: ${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}
    prefer-ip-address: true

spring:
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
  # Spring Boot 기본 Kafka 설정을 쓰는 서비스(user·notification)에 적용된다. match는 코드에서 직접 만든다.
  kafka:
    consumer:
      auto-offset-reset: earliest

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  # 개발·시연 기준으로 모든 요청을 추적한다.
  tracing:
    sampling:
      probability: 1.0
  # 스케줄 작업 자체는 돌고, 작업마다 생기는 span만 만들지 않는다.
  observations:
    enable:
      tasks: false
