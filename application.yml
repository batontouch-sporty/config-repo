# 전 서비스 공통 설정. 서비스별 값은 <서비스명>.yml, 환경별 접속 주소는 <서비스명>-<프로필>.yml에 둔다.
eureka:
  instance:
    instance-id: ${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}
    prefer-ip-address: true

spring:
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
  # Spring Boot 기본 Kafka 설정을 쓰는 서비스(user·notification)에 적용된다. match는 코드에서 직접 만든다.
  kafka:
    consumer:
      auto-offset-reset: earliest
  # Spring Cloud Bus 계정. 주소(host·port)는 <서비스명>-<프로필>.yml에 있다.
  rabbitmq:
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - prometheus
          # Bus 새로고침 확인용. 조회만 열고 로그 레벨 변경(POST)은 막는다. Gateway는 health 밖의 actuator를 막는다.
          - loggers
  endpoint:
    loggers:
      access: read-only
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  # 개발·시연 기준으로 모든 요청을 추적한다.
  tracing:
    sampling:
      probability: 1.0
  # 스케줄 작업 자체는 돌고, 작업마다 생기는 span만 만들지 않는다.
  observations:
    enable:
      tasks: false

# Bus 새로고침 시연 값. 이 값을 바꾸고 config-service의 /actuator/busrefresh를 부르면 재시작 없이 반영된다.
logging:
  level:
    com.example.sporty: INFO
