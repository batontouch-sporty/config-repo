spring:
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    username: ${USER_DB_USERNAME:user_app}
    password: ${USER_APP_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${USER_DB_DDL_AUTO:validate}
    open-in-view: false
  data:
    redis:
      timeout: 6000ms
  kafka:
    producer:
      # 브로커가 없을 때 Outbox 발행이 DB 잠금을 오래 잡지 않게 대기 시간을 줄인다.
      properties:
        max.block.ms: 3000
  # 탈퇴 Saga 시간 초과 때 match 결과 조회(GET /internal/withdrawals/{sagaId}).
  # match가 회원 잠금을 최대 3초 기다리므로 읽기 타임아웃은 그보다 길게 둔다.
  cloud:
    openfeign:
      client:
        config:
          userMatchWithdrawalClient:
            connectTimeout: ${USER_MATCH_CONNECT_TIMEOUT_MS:1000}
            readTimeout: ${USER_MATCH_READ_TIMEOUT_MS:5000}

jwt:
  secret: ${JWT_SECRET_KEY}

# 탈퇴 Saga. 시연에서 시간 초과를 빨리 보여 줄 때는 WITHDRAWAL_SAGA_TIMEOUT(예: 30s)·WITHDRAWAL_SAGA_GRACE를 줄인다.
# timeout은 match-service 규칙대로 0초 초과 5분 이하만 된다.
withdrawal:
  saga:
    timeout: ${WITHDRAWAL_SAGA_TIMEOUT:5m}
    grace: ${WITHDRAWAL_SAGA_GRACE:30s}

# 개발·시연용 관리자 초기 계정. ADMIN_EMAIL·ADMIN_PASSWORD가 둘 다 있으면 기동할 때 없을 때만 만든다.
admin:
  account:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    nickname: ${ADMIN_NICKNAME:}

# match-service 주소. 비우면 Eureka로 찾는다.
user:
  clients:
    match:
      url: ${USER_MATCH_SERVICE_URL:}
