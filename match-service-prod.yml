# K8s. 클러스터 안 서비스는 K8s DNS 이름, infra EC2(DB·Kafka·Redis·모니터링)는 환경변수로 받는다.
spring:
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
  datasource:
    url: jdbc:mariadb://${MARIADB_HOST}:${MARIADB_HOST_PORT:3306}/match_db
    # Config Server가 키스토어로 복호화해 내려 준다(K8s Secret config-encrypt-keystore). 공통 설정의 ${MATCH_APP_PASSWORD}를 prod에서만 덮어쓴다.
    password: '{cipher}'
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

match:
  # 탈퇴 Saga는 dev와 같이 켠다.
  withdrawal:
    enabled: ${MATCH_WITHDRAWAL_ENABLED:true}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://discovery-service:8761/eureka}

management:
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans
