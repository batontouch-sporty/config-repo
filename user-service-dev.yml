# Compose. 같은 네트워크의 서비스명과 내부 포트로 붙는다.
spring:
  rabbitmq:
    host: rabbitmq
    port: 5672
  datasource:
    url: jdbc:mariadb://mariadb:3306/user_db
  data:
    redis:
      host: redis
      port: 6379
  kafka:
    bootstrap-servers: kafka:29092

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://discovery-service:8761/eureka}

management:
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans
