# IDE 실행. 인프라는 Compose가 127.0.0.1에 연 포트로 붙는다(.env의 *_HOST_PORT).
spring:
  rabbitmq:
    host: localhost
    port: ${RABBITMQ_HOST_PORT:5672}
  datasource:
    url: jdbc:mariadb://${FACILITY_DB_HOST:localhost}:${MARIADB_HOST_PORT:3306}/facility_db

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

management:
  zipkin:
    tracing:
      endpoint: http://localhost:${ZIPKIN_HOST_PORT:9411}/api/v2/spans
