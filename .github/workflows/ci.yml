name: CI

# 설정 저장소 검사. YAML 문법과 평문 비밀값을 PR 단계에서 막는다.
# 비밀값은 Config Server 암호화 {cipher} 또는 환경변수 참조만 허용한다.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: YAML · 비밀값 검사
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: 검사 도구 설치
        run: pip install --quiet yamllint pyyaml

      - name: YAML 문법
        run: |
          yamllint -d "{extends: relaxed, rules: {line-length: disable}}" .

      - name: 비밀값 검사기 자체 확인
        run: python .github/scripts/test_check_secrets.py

      - name: 평문 비밀값 검사
        run: python .github/scripts/check_secrets.py
