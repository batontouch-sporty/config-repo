spring:
  ai:
    openai:
      # api-key는 기본값(not-configured)이 있어야 해서 ai-service의 application.yml에 둔다.
      # 키가 비어 있어도 서비스는 뜬다. 이때 AI 호출은 실패하고 초안은 503, 검색·추천은 Fallback으로 응답한다.
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
          parallel-tool-calls: false
    retry:
      # 응답이 길어지지 않도록 재시도하지 않는다(기본 10회). HTTP 클라이언트 재시도도 없다(LlmTimeoutConfig).
      max-attempts: 1

  cloud:
    loadbalancer:
      retry:
        # spring-ai가 가져온 spring-retry 때문에 LoadBalancer 재시도가 켜져 응답 지연 때 호출이 2번 나간다.
        # 끄지 않으면 read 3초가 6초가 되고, user·match·me가 모두 느리면 18초로 프론트 15초를 넘는다.
        enabled: false
    openfeign:
      client:
        config:
          default:
            # match·user 호출이 느리면 빨리 실패하고 Fallback으로 넘어간다.
            connect-timeout: 2000
            read-timeout: 3000

# LLM 호출 타임아웃. 넘으면 초안은 503, 검색·추천은 Fallback으로 응답한다.
ai:
  llm:
    connect-timeout: 3s
    read-timeout: 8s
