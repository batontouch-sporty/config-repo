# IDE 실행. 인프라는 Compose가 127.0.0.1에 연 포트로 붙는다(.env의 *_HOST_PORT).
spring:
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins: ${CORS_ALLOWED_ORIGIN:http://localhost:3000}

prometheus:
  url: ${PROMETHEUS_URL:http://localhost:9090}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

management:
  zipkin:
    tracing:
      endpoint: http://localhost:${ZIPKIN_HOST_PORT:9411}/api/v2/spans
