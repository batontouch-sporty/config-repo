# IDE 실행. 인프라는 Compose가 127.0.0.1에 연 포트로 붙는다(.env의 *_HOST_PORT).
spring:
  datasource:
    url: jdbc:mariadb://${USER_DB_HOST:localhost}:${MARIADB_HOST_PORT:3306}/user_db
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_HOST_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:${KAFKA_HOST_PORT:9092}}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

management:
  zipkin:
    tracing:
      endpoint: http://localhost:${ZIPKIN_HOST_PORT:9411}/api/v2/spans
