# K8s. 클러스터 안 Eureka·Zipkin은 K8s DNS 이름, infra EC2의 RabbitMQ는 환경변수로 받는다.
spring:
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
  ai:
    openai:
      # Config Server가 키스토어로 복호화해 내려 준다(K8s Secret config-encrypt-keystore).
      api-key: '{cipher}'

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://discovery-service:8761/eureka}

management:
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans
